[project]
name = "gata"
version = "0.1.0"
description = "Natural-language Q&A over Uttar Pradesh land records (Khatauni)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pymupdf",
    "opencv-python",
    "pytesseract",
    "pillow",
    "numpy",
    "indic-transliteration",
    "rapidfuzz",
    "sentence-transformers",
    "chromadb",
    "rank-bm25",
    "pydantic",
    "pyyaml",
    "typer",
]

[dependency-groups]
dev = ["pytest"]
agent = ["playwright"]

[project.scripts]
gata = "gata.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
